<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="timer-container">
        <div>
            <span class="timer">00:00:00</span>
        </div>

        <div class="controls">
            <button class="btn startBtn">Iniciar</button>
            <button class="btn pauseBtn">Pausar</button>
            <button class="btn resetBtn">Zerar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
